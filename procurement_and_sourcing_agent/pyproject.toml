[project]
name = "agent_3v01"
version = "0.1.0"
description = "Procurement & Product Sourcing Agent (Agent 3) — pydantic-ai, wired into Band"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "band-sdk[pydantic-ai]>=0.2.7",
    "pydantic-ai>=1.107.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# Standalone runner: turns a VirtualLabReport (Agent 2) into a product proposal.
agent_3v01 = "agent_3v01.main:run"
procurement = "agent_3v01.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_3v01"]
